baseURL= "https://www.lchang.me/"

enableEmoji=true

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[taxonomies]
  tag = "tags"
  category = "categories"

  
[languages]
  [languages.en]
    label = 'English'
