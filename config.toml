    [languages.en.params]
      description = "Academic homepage of Le Chang, featuring research in data center control, power systems, and nonlinear control."
  [languages.cn]
    label = '中文'
    title = "常乐"
    [languages.cn.params]
      description = "常乐的个人学术主页，介绍数据中心控制、电力系统与非线性控制方向的研究与成果。"


[module]
  [[module.mounts]]
    source = "content/en"
